<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk ke Ruang Baca</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark navbar-ruang-baca">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">Ruang Baca</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
        data-bs-target="#menuNavigasi" aria-controls="menuNavigasi"
        aria-expanded="false" aria-label="Buka navigasi">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuNavigasi">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Tentang</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Bantuan</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="login-area">
    <div class="container">
      <div class="row justify-content-center align-items-center">
        <div class="col-11 col-sm-9 col-md-7 col-lg-5 col-xl-4">
          <div class="card login-card shadow">
            <div class="card-body p-4">
              <h1 class="h4 text-center mb-2">Masuk ke Ruang Baca</h1>
              <p class="text-center text-secondary small mb-4">Temukan bacaan untuk hari ini.</p>

              <form>
                <div class="mb-3">
                  <label for="username" class="form-label">Username</label>
                  <input type="text" class="form-control" id="username"
                    placeholder="Masukkan username" autocomplete="username">
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="password"
                    placeholder="Masukkan password" autocomplete="current-password">
                </div>
                <div class="form-check mb-3">
                  <input class="form-check-input" type="checkbox" id="ingatSaya">
                  <label class="form-check-label" for="ingatSaya">Ingat saya</label>
                </div>
                <button type="button" class="btn btn-success w-100">Masuk</button>
              </form>
            </div>
            <div class="card-footer text-center py-3">
              <a href="#" class="forgot-link">Lupa password?</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
